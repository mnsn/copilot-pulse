name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported macOS (with Xcode 16) and the current one.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select --print-path
          swift --version

      - name: Test
        run: make test

      - name: Check the demo data
        run: make demo-check

      # The universal app that a release ships, checked and zipped (see scripts/package.sh).
      - name: Package the app
        run: make package

      # The release workflow builds on macos-26 too, so this is what a release would contain.
      - name: Upload the package
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Copilot-Pulse
          path: build/release/
          if-no-files-found: error

  release-build:
    name: Run the package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported macOS, on Apple silicon and on Intel.
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Copilot-Pulse
          path: build/release

      - name: Unzip the app
        run: |
          (cd build/release && shasum -a 256 -c Copilot-Pulse.zip.sha256)
          ditto -x -k build/release/Copilot-Pulse.zip build

      - name: Check the app
        run: ./scripts/check-app.sh "build/Copilot Pulse.app"
