name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Sketches and mockups are welcome. Please don't include private session data.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
